<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALSO | Your Everyday Calculator</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="calculator">
        <div class="logo"> <img src="img/logo.png" alt="logo"> </div>
        <div class="calculator-body">
            <div class="display"> 0 </div>
            <div class="buttons">

                <button>MC</button>
                <button>MR</button>
                <button>M+</button>
                <button>M-</button>
                <button>%</button>
                <button>+/-</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>÷</button>
                <button>CE</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>X</button>
                <button>C</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>−</button>
                <button>.</button>
                <button>0</button>
                <button>=</button>
                <button>+</button>

            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
